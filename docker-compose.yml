version: '3.8'

services:
  backend:
    build:
      context: ./backend_easycook
      dockerfile: Dockerfile
    container_name: easycook-backend
    ports:
      - "8787:8787"
    volumes:
      - ./backend_easycook:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    privileged: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-easycook
      dockerfile: Dockerfile
    container_name: easycook-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-easycook:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_BASE=http://localhost:8787
    depends_on:
      - backend
    restart: unless-stopped